name: Compilar APK y publicar versión web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: node scripts/preparar.js
      - name: Crear proyecto Android
        run: |
          [ -d android ] || npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#3b4a2a' --splashBackgroundColor '#3b4a2a' || echo "Se usarán los íconos por defecto"
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CalcoTactico.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CalcoTactico-apk
          path: CalcoTactico.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Calco Táctico v1.0.${{ github.run_number }}
          body: Descarga **CalcoTactico.apk** e instálala en un celular Android.
          files: CalcoTactico.apk

  web:
    name: Versión web (iPhone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/preparar.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  publicar-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
